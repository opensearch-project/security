name: Releases

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get tag
        id: tag
        uses: dawidd6/action-get-tag@727a6f0a561be04e09013531e73a3983a65e3479 # v1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Download release notes
        run: |
          curl -fsS -o release-notes.md "https://raw.githubusercontent.com/opensearch-project/security/main/release-notes/opensearch-security.release-notes-${TAG}.md"
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          bodyFile: release-notes.md
